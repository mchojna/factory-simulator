name: Feature request
description: Something the simulator should do that it does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the simulator does not support it now.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What the simulator should do, with an example of the input and the expected result.
    validations:
      required: true
