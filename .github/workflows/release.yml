name: release

# Pushing a version tag such as v0.1.0 builds the package, tests it and publishes
# the wheel and source distribution as a GitHub release.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  inputs:
    name: the tag, main, the version and the changelog agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Tag matches the package version
        run: test "v$(uv version --short)" = "${GITHUB_REF_NAME}"

      - name: Tag is on main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: The changelog has a section of the version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\] - " CHANGELOG.md

  tests:
    name: tests except properties and slow tests
    needs: inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: >-
          uv sync --locked --group provider-anthropic --group provider-google
          --group provider-openai --group provider-openrouter

      - name: Tests
        run: uv run pytest -m "not property and not slow and not stress"

  properties:
    name: properties and slow tests, group ${{ matrix.group }} of 8
    needs: inputs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: >-
          uv sync --locked --group provider-anthropic --group provider-google
          --group provider-openai --group provider-openrouter

      - name: Properties
        run: >-
          uv run pytest -m "property or slow" --splits 8 --group ${{ matrix.group }}
          --splitting-algorithm least_duration -v

  build:
    name: build
    needs: [tests, properties]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  github-release:
    name: publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # The notes are the section of the version in CHANGELOG.md, from its heading up
      # to the next heading of a version.
      - name: Notes of the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -n "$(tr -d '[:space:]' < notes.md)"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --notes-file notes.md --verify-tag
