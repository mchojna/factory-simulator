name: pull request

# Checks of the pull request itself. Whether the package works is the job of ci.yml.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: title is a conventional commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The title becomes the commit message of the squash merge on main. It passes
      # the check of the commit hook: one of the nine types, an optional scope in
      # lower case, and a subject of at most 72 characters that starts in lower
      # case and ends without a full stop.
      - name: Title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" | grep -Eq '^(feat|fix|docs|refactor|test|chore|perf|build|ci)(\([a-z0-9-]+\))?!?: [a-z].{0,70}[^.]$'
